<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="TradeVault — a trading journal and analytics workspace. Record trades, review performance and find your patterns."
    />
    <title>TradeVault — Trading Journal &amp; Analytics</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong theme. Falls back to dark, which is the product default.
      (function () {
        try {
          var saved = localStorage.getItem("tradevault.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      TradeVault needs JavaScript enabled. It is a workspace app, not a static page.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
